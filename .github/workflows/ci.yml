name: Build and Security Baseline

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build (Supabase setup pending mode)
        run: npm run build
      - name: Anonymous auth guards (Supabase not configured in CI)
        run: |
          set -euo pipefail
          PORT=3005 HOSTNAME=127.0.0.1 node .next/standalone/server.js > /tmp/amoaica-standalone.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3005/sign-in > /dev/null; then break; fi
            sleep 1
          done
          AMO_BASE_URL=http://127.0.0.1:3005 npm run test:auth-smoke
      - name: Block critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=critical
