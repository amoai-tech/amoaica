name: Build and Security Baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build (Supabase setup pending mode)
        run: npm run build
      - name: Password reset route and redirect smoke checks
        run: |
          set -euo pipefail
          PORT=3011 HOSTNAME=127.0.0.1 node .next/standalone/server.js > /tmp/amo-password-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3011/forgot-password > /dev/null; then break; fi
            sleep 1
          done
          TEST_BASE_URL=http://127.0.0.1:3011 node scripts/smoke-password-reset.mjs
      - name: Mastra storage selection checks (no live DB)
        run: npm run test:storage-smoke
      - name: Block critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=critical
